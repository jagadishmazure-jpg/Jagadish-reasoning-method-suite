[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-method-suite"
version = "0.1.0"
description = "A measurement instrument comparing deterministic simulated reasoning methods on one identical harness."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["reasoning_suite"]
